name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip ccache \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo5 cmake libffi-dev libssl-dev \
            automake

      - name: Install buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer==1.5.0 cython==0.29.36

      - name: Cache buildozer global dir
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-global-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-global-${{ runner.os }}-

      # Stable debug keystore — separate cache with fixed key so it never
      # gets invalidated when buildozer.spec changes. Without this, p4a
      # generates a new keystore on every cache-miss build, breaking
      # in-place APK updates (Android rejects APKs signed by a different key).
      - name: Cache debug keystore
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer/android/platform/debug.keystore
            ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Cache buildozer project dir
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: buildozer-project-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-project-${{ runner.os }}-

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Configure ccache
        run: |
          ccache --max-size=2G
          ccache --zero-stats
          echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV
          echo "USE_CCACHE=1" >> $GITHUB_ENV

      - name: Bump android.numeric_version to run number
        run: |
          sed -i "s/^android\.numeric_version.*/android.numeric_version = ${{ github.run_number }}/" buildozer.spec
          grep -n "android.numeric_version" buildozer.spec

      - name: Verify Java version
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          java -version

      - name: Build debug APK
        run: |
          buildozer -v android debug

      - name: Show ccache stats
        if: always()
        run: ccache --show-stats

      - name: Show APK signature
        if: always()
        run: |
          APK=$(ls bin/*.apk 2>/dev/null | head -1)
          if [ -n "$APK" ]; then
            echo "APK: $APK"
            APKSIGNER=$(find ~/.buildozer/android/platform/android-sdk/build-tools -name apksigner 2>/dev/null | head -1)
            if [ -n "$APKSIGNER" ]; then
              "$APKSIGNER" verify --print-certs "$APK" || true
            fi
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: operafast-debug
          path: bin/*.apk
          retention-days: 30
          if-no-files-found: error
