plugins {
    id 'com.android.application'
}

// CI passes a growing VERSION_CODE so each build installs over the previous one.
def vc = (System.getenv('VERSION_CODE') ?: '1').toInteger()
// Own signing key (GitHub secrets). Without it the build falls back to the old committed key.
def releaseKs = System.getenv('KEYSTORE_PATH')

android {
    namespace 'org.blackorange.operafast'
    compileSdk 34

    defaultConfig {
        applicationId 'org.blackorange.operafast'
        minSdk 26
        targetSdk 34
        versionCode vc
        versionName '0.2.0'
    }

    // Same committed keystore as before, so updates install over earlier APKs.
    signingConfigs {
        debug {
            storeFile file('../android/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (releaseKs) {
            release {
                storeFile file(releaseKs)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig releaseKs ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
